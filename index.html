<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My College Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ---------- Theme tokens ---------- */
:root{--bg:#eef1f6;--surface:#fff;--ink:#19223b;--muted:#5d6785;--line:#d9dfeb;--brand:#2d3fd3;--brand-ink:#fff;--grid:rgba(45,63,211,.07);--shadow:0 1px 2px rgba(25,34,59,.06),0 6px 18px rgba(25,34,59,.05)}
:root[data-theme="dark"]{--bg:#0e1322;--surface:#161d33;--ink:#e8ecf8;--muted:#98a3c4;--line:#28324f;--brand:#8b9bff;--brand-ink:#0e1322;--grid:rgba(139,155,255,.07);--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background-color:var(--bg);
 /* graph-paper background */
 background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* ---------- Header ---------- */
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:1080px;margin:auto;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.brand{display:flex;flex-direction:column;margin-right:auto}
.brand h1{font-size:1.35rem}
.brand button{all:unset;cursor:pointer;font-size:.82rem;color:var(--muted)}
.brand button:hover{color:var(--brand)}
.search{flex:1 1 220px;min-width:180px;max-width:380px;padding:9px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;transition:transform .15s,border-color .15s}
.btn:hover{border-color:var(--brand);transform:translateY(-1px)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:600}
.btn.danger:hover{border-color:#d33;color:#d33}
.btn.sm{padding:5px 10px;font-size:.85rem}
nav{max-width:1080px;margin:auto;padding:0 16px 10px;display:flex;gap:6px;flex-wrap:wrap}
nav .btn[aria-current="page"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

main{max-width:1080px;margin:auto;padding:24px 16px 80px}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px}
.head h2{font-size:1.7rem}
.sub{color:var(--muted);font-size:.92rem}

/* ---------- Subject cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:14px;padding:16px;box-shadow:var(--shadow);cursor:pointer;transition:transform .18s,box-shadow .18s;text-align:left}
.card:hover{transform:translateY(-3px) rotate(-.4deg)}
.ico{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:1.6rem;background:color-mix(in srgb,var(--c) 18%,transparent)}
.card h3{font-size:1.15rem;margin:12px 0 2px}
.prog{height:6px;border-radius:9px;background:var(--line);margin-top:12px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--c)}
.card.add{border:2px dashed var(--line);display:grid;place-items:center;min-height:150px;color:var(--muted);box-shadow:none}

/* ---------- Notes ---------- */
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tools select{padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.unit{margin:22px 0 8px;font-size:1.05rem;display:flex;align-items:center;gap:8px}
.unit::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c)}
.note{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:12px;padding:11px 12px;margin-bottom:8px;transition:box-shadow .15s}
.note:hover{box-shadow:var(--shadow)}
.nb{flex:1;min-width:0}
.nt{font-weight:600;overflow-wrap:anywhere}
.nt.dn{text-decoration:line-through;color:var(--muted)}
.nm{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px;font-size:.8rem;color:var(--muted)}
.pill{padding:1px 9px;border-radius:999px;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--ink)}
.tag{padding:1px 8px;border:1px solid var(--line);border-radius:6px}
.na{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.star{font-size:1.1rem;line-height:1;padding:5px 8px}
.star.on{color:#e8a200;border-color:#e8a200}
.chk input{width:20px;height:20px;accent-color:var(--brand);cursor:pointer}
.empty{padding:40px 16px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:14px}

/* ---------- Dialog ---------- */
dialog{border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);width:min(520px,94vw);padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,14,28,.55)}
dialog[open]{animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
dialog h3{margin-bottom:12px;font-size:1.25rem}
label.f{display:block;font-size:.85rem;color:var(--muted);margin-top:10px}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:4px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.row{display:flex;gap:10px}.row>*{flex:1}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.reader{white-space:pre-wrap;max-height:55vh;overflow:auto;background:var(--bg);padding:12px;border-radius:10px;border:1px solid var(--line)}

@media (max-width:600px){.note{flex-wrap:wrap}.na{width:100%;justify-content:flex-start}.head h2{font-size:1.4rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand"><h1>My College Notes</h1><button id="meta" title="Edit course and semester"></button></div>
    <input id="q" class="search" type="search" placeholder="Search title, tag or content" aria-label="Search notes">
    <button class="btn" id="theme" aria-label="Toggle dark mode">🌙</button>
  </div>
  <nav>
    <button class="btn" data-go="home">Subjects</button>
    <button class="btn" data-go="fav">★ Favorites</button>
    <button class="btn" id="export">Export backup</button>
    <button class="btn" id="import">Import backup</button>
    <input type="file" id="file" accept="application/json" hidden>
  </nav>
</header>
<main id="main"></main>
<dialog id="dlg"></dialog>

<script>
/* =========================================================
   My College Notes: data lives in your browser (localStorage)
   ========================================================= */
const KEY = 'collegeNotes.v1', THEME_KEY = 'collegeNotes.theme';
const TYPES = {PDF:'📄', Handwritten:'✍️', PPT:'📊', Link:'🔗', Text:'📝'};
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9);
const today = () => new Date().toISOString().slice(0, 10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = d => new Date(d + 'T00:00:00').toLocaleDateString('en-IN', {day:'numeric', month:'short', year:'numeric'});

/* ---------- Sample data (edit or delete from the app) ---------- */
function seed() {
  const sub = (id, name, icon, color) => ({id, name, icon, color});
  const n = (sid, unit, title, type, tags, extra = {}) =>
    ({id: uid(), sid, unit, title, type, date: today(), tags, url: '', text: '', star: false, done: false, ...extra});
  return {
    meta: {course: 'B.Tech Computer Science', sem: 'Semester 3'},
    subjects: [
      sub('ds', 'Data Structures', '🌳', '#2d9d78'),
      sub('db', 'DBMS', '🗄️', '#d9822b'),
      sub('os', 'Operating Systems', '⚙️', '#7a4fd6'),
      sub('mt', 'Maths-III', '📐', '#d2455b'),
      sub('py', 'Python', '🐍', '#2f7fd1')
    ],
    notes: [
      n('ds','Unit 1: Arrays and Linked Lists','Linked list cheat sheet','PDF',['revision','linked-list'],{url:'https://drive.google.com/',star:true}),
      n('ds','Unit 1: Arrays and Linked Lists','Array vs linked list','Text',['basics'],{text:'Arrays: O(1) random access, costly insert.\nLinked lists: O(1) insert at head, O(n) search.',done:true}),
      n('ds','Unit 2: Trees','BST insertion and deletion','Handwritten',['tree','important'],{url:'https://drive.google.com/'}),
      n('db','Unit 1: ER Model','ER diagram slides','PPT',['er','diagram'],{url:'https://drive.google.com/'}),
      n('db','Unit 2: Normalization','1NF to BCNF summary','Text',['normalization','exam'],{text:'1NF: atomic values.\n2NF: no partial dependency.\n3NF: no transitive dependency.\nBCNF: every determinant is a candidate key.',star:true}),
      n('os','Unit 1: Processes','Process states and scheduling','PDF',['scheduling'],{url:'https://drive.google.com/'}),
      n('os','Unit 2: Memory','Paging vs segmentation','Link',['memory'],{url:'https://en.wikipedia.org/wiki/Memory_paging'}),
      n('mt','Unit 1: Fourier Series','Fourier formulas','Handwritten',['formulas','exam'],{star:true,text:'Handwritten pages: scan them and add the link here.'}),
      n('py','Unit 1: Basics','Python list comprehensions','Text',['syntax'],{text:'[x*x for x in range(10) if x % 2 == 0]',done:true}),
      n('py','Unit 2: OOP','Classes and inheritance','Link',['oop'],{url:'https://docs.python.org/3/tutorial/classes.html'})
    ]
  };
}

/* ---------- State and storage ---------- */
function load() {
  try { const r = localStorage.getItem(KEY); if (r) return JSON.parse(r); } catch (e) {}
  return seed();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { alert('Could not save. Browser storage may be blocked.'); } }
let S = load();
const V = {page: 'home', sid: null, type: 'all', sort: 'new'};
const subj = id => S.subjects.find(s => s.id === id) || {name: 'Unknown', icon: '❓', color: '#888'};

/* ---------- Helpers: search, filter, sort ---------- */
const query = () => $('#q').value.trim().toLowerCase();
const matches = n => {
  const q = query();
  return n.title.toLowerCase().includes(q) || (n.text || '').toLowerCase().includes(q) ||
    n.unit.toLowerCase().includes(q) || n.tags.some(t => t.toLowerCase().includes(q));
};
function refine(list) {
  if (V.type !== 'all') list = list.filter(n => n.type === V.type);
  const by = {new: (a, b) => b.date.localeCompare(a.date), old: (a, b) => a.date.localeCompare(b.date),
              name: (a, b) => a.title.localeCompare(b.title)}[V.sort];
  return [...list].sort(by);
}

/* ---------- Rendering ---------- */
function render() {
  const active = query() ? null : (V.page === 'subject' ? 'home' : V.page);
  document.querySelectorAll('nav [data-go]').forEach(b => {
    if (b.dataset.go === active) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  $('#meta').textContent = S.meta.course + ', ' + S.meta.sem;
  const m = $('#main');
  if (query()) m.innerHTML = listView('Search results', S.notes.filter(matches), 'No notes match your search.');
  else if (V.page === 'fav') m.innerHTML = listView('Favorites', S.notes.filter(n => n.star), 'Star a note to see it here.');
  else if (V.page === 'subject') m.innerHTML = subjectView();
  else m.innerHTML = homeView();
}

function homeView() {
  const cards = S.subjects.map(s => {
    const ns = S.notes.filter(n => n.sid === s.id), d = ns.filter(n => n.done).length;
    return `<div class="card" style="--c:${s.color}" tabindex="0" role="button" data-act="open-subject" data-id="${s.id}">
      <div class="ico">${esc(s.icon)}</div><h3>${esc(s.name)}</h3>
      <div class="sub">${ns.length} note${ns.length === 1 ? '' : 's'}, ${d} completed</div>
      <div class="prog"><i style="width:${ns.length ? d / ns.length * 100 : 0}%"></i></div></div>`;
  }).join('');
  return `<div class="head"><div><h2>Your subjects</h2><div class="sub">${S.notes.length} notes in total</div></div>
    <button class="btn primary" data-act="add-note">+ Add note</button></div>
    <div class="grid">${cards}<div class="card add" tabindex="0" role="button" data-act="add-subject">+ Add subject</div></div>`;
}

function controls() {
  const opt = (v, t, cur) => `<option value="${v}" ${v === cur ? 'selected' : ''}>${t}</option>`;
  return `<div class="tools">
    <select data-act="ftype" aria-label="Filter by type">${opt('all', 'All types', V.type)}${Object.keys(TYPES).map(t => opt(t, t, V.type)).join('')}</select>
    <select data-act="fsort" aria-label="Sort notes">${opt('new', 'Newest first', V.sort)}${opt('old', 'Oldest first', V.sort)}${opt('name', 'Name A to Z', V.sort)}</select></div>`;
}

function noteHTML(n, showSubj) {
  const s = subj(n.sid);
  return `<article class="note" style="--c:${s.color}">
    <label class="chk" title="Mark as completed"><input type="checkbox" data-act="done" data-id="${n.id}" ${n.done ? 'checked' : ''}></label>
    <div class="nb"><div class="nt ${n.done ? 'dn' : ''}">${esc(n.title)}</div>
      <div class="nm"><span class="pill">${TYPES[n.type] || ''} ${esc(n.type)}</span>
      ${showSubj ? `<span class="pill">${esc(s.icon)} ${esc(s.name)}</span>` : ''}
      <span>${fmt(n.date)}</span>${n.tags.map(t => `<span class="tag">#${esc(t)}</span>`).join('')}</div></div>
    <div class="na">
      ${n.url ? `<button class="btn sm" data-act="open-link" data-id="${n.id}">Open</button>` : ''}
      ${n.text ? `<button class="btn sm" data-act="read" data-id="${n.id}">Read</button>` : ''}
      <button class="btn sm star ${n.star ? 'on' : ''}" data-act="star" data-id="${n.id}" aria-label="Toggle important" aria-pressed="${n.star}">${n.star ? '★' : '☆'}</button>
      <button class="btn sm" data-act="edit-note" data-id="${n.id}">Edit</button>
      <button class="btn sm danger" data-act="del-note" data-id="${n.id}">Delete</button></div></article>`;
}

function listView(title, notes, emptyMsg) {
  const list = refine(notes);
  return `<div class="head"><h2>${title}</h2></div>${controls()}` +
    (list.length ? list.map(n => noteHTML(n, true)).join('') : `<div class="empty">${emptyMsg}</div>`);
}

function subjectView() {
  const s = subj(V.sid), list = refine(S.notes.filter(n => n.sid === V.sid));
  const groups = {};
  list.forEach(n => (groups[n.unit || 'General'] ||= []).push(n));
  const units = Object.keys(groups).sort((a, b) => a.localeCompare(b, undefined, {numeric: true}));
  return `<div class="head" style="--c:${s.color}">
    <div><button class="btn sm" data-go="home">← All subjects</button>
    <h2 style="margin-top:10px">${esc(s.icon)} ${esc(s.name)}</h2></div>
    <div class="na"><button class="btn primary" data-act="add-note">+ Add note</button>
    <button class="btn" data-act="edit-subject">Edit subject</button>
    <button class="btn danger" data-act="del-subject">Delete subject</button></div></div>${controls()}` +
    (units.length ? units.map(u => `<h3 class="unit" style="--c:${s.color}">${esc(u)}</h3>${groups[u].map(n => noteHTML(n, false)).join('')}`).join('')
      : `<div class="empty">No notes here yet. Use “Add note” to create your first one.</div>`);
}

/* ---------- Dialogs (add / edit forms) ---------- */
const dlg = $('#dlg');
function openForm(html, onSubmit) {
  dlg.innerHTML = html;
  const f = dlg.querySelector('form');
  f.onsubmit = e => { e.preventDefault(); onSubmit(Object.fromEntries(new FormData(f))); dlg.close(); };
  dlg.querySelector('[data-close]').onclick = () => dlg.close();
  dlg.showModal();
}
const field = (label, name, val = '', attrs = '') => `<label class="f">${label}<input name="${name}" value="${esc(val)}" ${attrs}></label>`;

function noteForm(n) {
  const isNew = !n;
  if (!S.subjects.length) return alert('Add a subject first.');
  n = n || {sid: V.sid || S.subjects[0].id, unit: '', title: '', type: 'PDF', date: today(), tags: [], url: '', text: ''};
  openForm(`<h3>${isNew ? 'Add note' : 'Edit note'}</h3><form>
    <label class="f">Subject<select name="sid">${S.subjects.map(s => `<option value="${s.id}" ${s.id === n.sid ? 'selected' : ''}>${esc(s.icon)} ${esc(s.name)}</option>`).join('')}</select></label>
    ${field('Title', 'title', n.title, 'required')}
    ${field('Unit or chapter', 'unit', n.unit, 'placeholder="Unit 1: Introduction"')}
    <div class="row"><label class="f">Type<select name="type">${Object.keys(TYPES).map(t => `<option ${t === n.type ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
    ${field('Date added', 'date', n.date, 'type="date"')}</div>
    ${field('Link (Google Drive, PDF or web)', 'url', n.url, 'type="url" placeholder="https://"')}
    <label class="f">Typed notes (optional)<textarea name="text" rows="4">${esc(n.text)}</textarea></label>
    ${field('Tags (comma separated)', 'tags', n.tags.join(', '))}
    <div class="acts"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary">Save note</button></div></form>`,
  d => {
    const data = {sid: d.sid, title: d.title.trim(), unit: d.unit.trim(), type: d.type, date: d.date || today(),
      url: d.url.trim(), text: d.text, tags: d.tags.split(',').map(t => t.trim()).filter(Boolean)};
    if (isNew) S.notes.push({id: uid(), star: false, done: false, ...data}); else Object.assign(n, data);
    save(); render();
  });
}

function subjectForm(s) {
  const isNew = !s;
  s = s || {name: '', icon: '📘', color: '#2d3fd3'};
  openForm(`<h3>${isNew ? 'Add subject' : 'Edit subject'}</h3><form>
    ${field('Subject name', 'name', s.name, 'required')}
    <div class="row">${field('Icon (emoji)', 'icon', s.icon, 'maxlength="4"')}${field('Color', 'color', s.color, 'type="color"')}</div>
    <div class="acts"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary">Save subject</button></div></form>`,
  d => {
    const data = {name: d.name.trim(), icon: d.icon || '📘', color: d.color};
    if (isNew) S.subjects.push({id: uid(), ...data}); else Object.assign(s, data);
    save(); render();
  });
}

/* ---------- Click handling (one listener for everything) ---------- */
const find = id => S.notes.find(n => n.id === id);
document.addEventListener('click', e => {
  const go = e.target.closest('[data-go]');
  if (go) { $('#q').value = ''; V.page = go.dataset.go; return render(); }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const id = el.dataset.id, n = id && find(id);
  switch (el.dataset.act) {
    case 'open-subject': V.page = 'subject'; V.sid = id; scrollTo(0, 0); break;
    case 'add-note': return noteForm();
    case 'add-subject': return subjectForm();
    case 'edit-subject': return subjectForm(subj(V.sid));
    case 'del-subject':
      if (confirm('Delete this subject and all its notes?')) {
        S.subjects = S.subjects.filter(s => s.id !== V.sid); S.notes = S.notes.filter(x => x.sid !== V.sid);
        V.page = 'home'; save();
      } else return; break;
    case 'edit-note': return noteForm(n);
    case 'del-note': if (confirm('Delete this note?')) { S.notes = S.notes.filter(x => x.id !== id); save(); } else return; break;
    case 'star': n.star = !n.star; save(); break;
    case 'open-link': window.open(n.url, '_blank', 'noopener'); return;
    case 'read':
      dlg.innerHTML = `<h3>${esc(n.title)}</h3><div class="reader">${esc(n.text)}</div><div class="acts"><button class="btn primary" data-close>Close</button></div>`;
      dlg.querySelector('[data-close]').onclick = () => dlg.close(); dlg.showModal(); return;
    default: return;
  }
  render();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches('.card[role="button"]')) e.target.click();
});
document.addEventListener('change', e => {
  const el = e.target, a = el.dataset.act;
  if (a === 'done') { find(el.dataset.id).done = el.checked; save(); }
  else if (a === 'ftype') V.type = el.value;
  else if (a === 'fsort') V.sort = el.value;
  else return;
  render();
});
$('#q').addEventListener('input', render);
$('#meta').onclick = () => {
  const c = prompt('Course or branch:', S.meta.course); if (c === null) return;
  const s = prompt('Semester or year:', S.meta.sem); if (s === null) return;
  S.meta = {course: c.trim() || S.meta.course, sem: s.trim() || S.meta.sem}; save(); render();
};

/* ---------- Export / Import ---------- */
$('#export').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 2)], {type: 'application/json'}));
  a.download = 'college-notes-backup-' + today() + '.json'; a.click(); URL.revokeObjectURL(a.href);
};
$('#import').onclick = () => $('#file').click();
$('#file').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!Array.isArray(d.subjects) || !Array.isArray(d.notes)) throw 0;
      if (confirm('Replace all current notes with this backup?')) { S = {meta: d.meta || S.meta, subjects: d.subjects, notes: d.notes}; V.page = 'home'; save(); render(); }
    } catch (err) { alert('That file is not a valid notes backup.'); }
  };
  r.readAsText(f); e.target.value = '';
};

/* ---------- Dark / light mode ---------- */
function setTheme(t) {
  document.documentElement.dataset.theme = t; $('#theme').textContent = t === 'dark' ? '☀️' : '🌙';
  try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
}
let saved = null; try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
setTheme(saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
$('#theme').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');

render();
</script>
</body>
</html>
